<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Inter:wght@500;600;700;800;900&family=JetBrains+Mono:wght@500;700&family=Manrope:wght@500;600;700;800&family=Noto+Sans+Devanagari:wght@700;800&display=swap" rel="stylesheet">
<style>
  /* Same look as the /free page. "studio" is the exact freebies palette; other themes swap the colours. */
  /* studio = the ReplyInbox brand: paper + dot grid, ink outlines, cobalt accent, volt highlighter, coral catch */
  .t-studio   { --bg:radial-gradient(rgba(17,19,24,.13) 1px,transparent 1.3px) 0 0/22px 22px,#F5F4EF; --ink:#111318; --mute:#5E6068; --card:#fff; --card-ink:#111318; --card-mute:#5E6068; --line:#111318;
                --rose:#2E3BFF; --cer:#FF5B3A; --hl:#111318; --btn:#111318; --btn-ink:#D4FF3A; --thumb:#E6E5DE; }
  .t-sunset   { --bg:linear-gradient(165deg,#4f5bd5,#962fbf 35%,#d62976 65%,#fa7e1e 90%,#feda75); --ink:#fff; --mute:rgba(255,255,255,.82);
                --card:#fff; --card-ink:#1d1530; --card-mute:#7a6f8a; --line:rgba(255,255,255,.35); --rose:#d62976; --cer:#4f5bd5;
                --btn:#fff; --btn-ink:#1d1530; --hl:#FFE27A; --thumb:linear-gradient(135deg,#FFF1F8,#F3F0FF); }
  .t-midnight { --bg:radial-gradient(circle at 20% 0%,#3b1d6e,#120f1a 60%); --ink:#f1ecfa; --mute:#b8afcf; --card:#1f1930; --card-ink:#f1ecfa;
                --card-mute:#a59cba; --line:#2d2540; --rose:#f472b6; --cer:#a78bfa; --btn:#f1ecfa; --btn-ink:#120f1a; --hl:#f9a8d4;
                --thumb:linear-gradient(135deg,#2a2140,#1f2a3a); }
  .t-ocean    { --bg:linear-gradient(170deg,#0ea5e9,#0d9488 60%,#065f46); --ink:#fff; --mute:rgba(255,255,255,.85); --card:#fff;
                --card-ink:#0f2a33; --card-mute:#5b7480; --line:rgba(255,255,255,.35); --rose:#0891b2; --cer:#0d9488;
                --btn:#fff; --btn-ink:#0f2a33; --hl:#BBF7D0; --thumb:linear-gradient(135deg,#ECFBFF,#EFFCF6); }
  .t-candy    { --bg:linear-gradient(170deg,#fde2f3,#e9d5ff 55%,#c7d2fe); --ink:#3b1f4a; --mute:#6b4f7a; --card:#fff; --card-ink:#3b1f4a;
                --card-mute:#7d6889; --line:rgba(59,31,74,.12); --rose:#db2777; --cer:#7c3aed; --btn:#3b1f4a; --btn-ink:#fff;
                --thumb:linear-gradient(135deg,#FFF1F8,#F4F0FF); }
  .t-mono     { --bg:#fafafa; --ink:#111; --mute:#666; --card:#fff; --card-ink:#111; --card-mute:#777; --line:#e5e5e5;
                --rose:#111; --cer:#555; --btn:#111; --btn-ink:#fff; --thumb:linear-gradient(135deg,#f6f6f6,#efefef); }

  /* ReplyInbox brand details for the studio theme */
  .t-studio { font-family:Manrope,Inter,'Noto Sans Devanagari',system-ui,sans-serif; background-attachment:scroll; }
  .t-studio h1, .t-studio .handle, .t-studio .t, .t-studio .kw, .t-studio .join h2 { font-family:'Bricolage Grotesque',Manrope,sans-serif; font-weight:800; letter-spacing:-.03em; }
  .t-studio h1 span { color:#111318; background:#D4FF3A; padding:0 .14em; -webkit-box-decoration-break:clone; box-decoration-break:clone; }
  .t-studio .kw { letter-spacing:-.02em; text-transform:uppercase; }
  .t-studio .kw small, .t-studio .label, .t-studio .tag, .t-studio .topic, .t-studio .new { font-family:'JetBrains Mono',monospace; letter-spacing:.06em; text-transform:uppercase; }
  .t-studio .kw small { color:#2E3BFF; }
  .t-studio .tag { background:#2E3BFF; } .t-studio .tag.c { background:#D4FF3A; color:#111318; }
  .t-studio .topic { background:#D4FF3A; color:#111318; border:2px solid #111318; }
  .t-studio .new { background:#FF5B3A; border:2px solid #111318; }
  .t-studio .card, .t-studio .join { border:3px solid #111318; }
  .t-studio .shadow { box-shadow:6px 6px 0 #111318; }
  .t-studio .thumb { border-bottom:3px solid #111318; }
  .t-studio .emo { border:2px solid #111318; box-shadow:3px 3px 0 #111318; }
  .t-studio .link .ico { border:2px solid #111318; background:#D4FF3A; }
  .t-studio .open { border-radius:30px; border:2px solid #111318; }
  .t-studio .socials a { border:2px solid #111318; box-shadow:3px 3px 0 #111318; }
  .t-studio .share, .t-studio .av img, .t-studio .av .ini { border-color:#111318; }
  .t-studio .follow { border:3px solid #111318; box-shadow:6px 6px 0 #2E3BFF; animation:none; }
  .t-studio .freecard, .t-studio .prod.featured { animation:none; }
  .t-studio .card:hover { transform:translate(-2px,-2px); box-shadow:8px 8px 0 #111318; }
  .t-studio footer a { color:#2E3BFF; }

  * { box-sizing:border-box; }
  html, body { margin:0; min-height:100%; }
  body { background:var(--bg); background-attachment:fixed; color:var(--ink); font-family:Inter,'Noto Sans Devanagari',system-ui,sans-serif;
         -webkit-font-smoothing:antialiased; overflow-x:hidden; }
  a { color:inherit; }
  .wrap { max-width:520px; margin:0 auto; padding:22px 16px 60px; }
  .shadow { box-shadow:0 18px 40px rgba(60,40,20,.14); }

  .top { display:flex; align-items:center; gap:12px; }
  .av { width:60px; height:60px; border-radius:50%; padding:3px; flex:none; position:relative; isolation:isolate;
        animation: avin .6s cubic-bezier(.3,1.6,.5,1) backwards; }
  /* Profile photo: story-style gradient ring that slowly spins, a rose pulse rippling out, a pop-in on load,
     and a little bounce when tapped or hovered. The photo itself never rotates. */
  .av::before { content:""; position:absolute; inset:0; border-radius:50%; z-index:-1;
                background:conic-gradient(var(--rose),#F5B83D,var(--cer),var(--rose)); animation: spin 4s linear infinite; }
  .av::after { content:""; position:absolute; inset:0; border-radius:50%; z-index:-2; animation: ripple 2.4s ease-out infinite; }
  .av img, .av .ini { transition: transform .25s cubic-bezier(.3,1.6,.5,1); }
  .av:active img, .av:active .ini { transform: scale(.92); }
  @media (hover:hover) { .av:hover img, .av:hover .ini { transform: scale(1.06) rotate(-4deg); } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes ripple { 0% { box-shadow:0 0 0 0 color-mix(in srgb, var(--rose) 50%, transparent); }
                      100% { box-shadow:0 0 0 12px color-mix(in srgb, var(--rose) 0%, transparent); } }
  @keyframes avin { from { transform: scale(.4) rotate(-20deg); opacity:0; } }
  .av img, .av .ini { width:100%; height:100%; border-radius:50%; border:3px solid var(--card); display:block; object-fit:cover; background:var(--card); }
  .av .ini { display:grid; place-items:center; font:900 24px Inter; color:var(--card-ink); }
  .handle { font-weight:900; font-size:17px; }
  .tags { display:flex; gap:6px; margin-top:4px; flex-wrap:wrap; }
  .tag { display:inline-block; font-size:11px; font-weight:800; color:#fff; background:var(--rose); border-radius:20px; padding:2px 9px; }
  .tag.c { background:var(--cer); }
  .share { margin-left:auto; width:42px; height:42px; border-radius:50%; border:2px solid var(--line); background:var(--card); color:var(--card-ink);
           display:grid; place-items:center; cursor:pointer; flex:none; }
  .share svg { width:18px; height:18px; }

  h1 { font-size:34px; line-height:1.05; letter-spacing:-1px; margin:18px 0 8px; font-weight:900; }
  h1 span { color:var(--hl, var(--rose)); }
  .bio { color:var(--mute); font-weight:600; font-size:15px; line-height:1.5; margin:0 0 14px; white-space:pre-line; }

  .socials { display:flex; flex-wrap:wrap; gap:8px; padding:2px 0 4px; }  /* wrap, so every chip (e.g. Website) is visible */
  .socials::-webkit-scrollbar { display:none; }
  .socials a { flex:none; display:inline-flex; align-items:center; gap:7px; text-decoration:none; border:2px solid var(--line); background:var(--card);
               color:var(--card-ink); border-radius:30px; padding:7px 13px 7px 10px; font:800 13px Inter,sans-serif; }
  .socials svg { width:17px; height:17px; }

  .follow { display:flex; align-items:center; justify-content:center; gap:9px; margin:14px 0 12px; background:var(--btn); color:var(--btn-ink);
            text-decoration:none; font-weight:900; font-size:16px; border-radius:14px; padding:14px; }
  .follow svg { width:19px; height:19px; }
  /* Follow button: soft rose glow pulse, a light sweep across it, and a little icon wiggle */
  .follow { position:relative; overflow:hidden; isolation:isolate; animation: glow 2.4s ease-in-out infinite; transition: transform .15s; }
  .follow:active { transform: scale(.97); }
  .follow::after { content:""; position:absolute; inset:0; z-index:-1; pointer-events:none;
                   background:linear-gradient(105deg, transparent 35%, color-mix(in srgb, var(--rose) 55%, transparent) 50%, transparent 65%);
                   transform:translateX(-120%); animation: sweep 3s ease-in-out infinite; }
  .follow svg { animation: wiggle 3s ease-in-out infinite; transform-origin: 50% 60%; }
  @keyframes glow { 0%, 100% { box-shadow:0 0 0 0 color-mix(in srgb, var(--rose) 45%, transparent), 0 10px 24px rgba(28,26,23,.18); transform:scale(1); }
                    50% { box-shadow:0 0 0 8px color-mix(in srgb, var(--rose) 0%, transparent), 0 14px 30px rgba(28,26,23,.22); transform:scale(1.02); } }
  @keyframes sweep { 0%, 35% { transform:translateX(-120%); } 75%, 100% { transform:translateX(120%); } }
  @keyframes wiggle { 0%, 70%, 100% { transform:rotate(0); } 76% { transform:rotate(-14deg); } 82% { transform:rotate(12deg); } 88% { transform:rotate(-6deg); } 94% { transform:rotate(3deg); } }
  /* Freebies card: rose ring that breathes, gift that bobs and shakes, sparkles, pulsing count, nudging arrow */
  .freecard { position:relative; animation: ring 2.8s ease-in-out infinite; }
  .freecard .thumb::after { content:""; position:absolute; inset:0; pointer-events:none;
                            background:linear-gradient(110deg, transparent 40%, rgba(255,255,255,.75) 50%, transparent 60%);
                            transform:translateX(-120%); animation: sweep 3.6s ease-in-out infinite 1s; }
  .freecard .emo { animation: gift 2.8s ease-in-out infinite; }
  .freecard .new { animation: pop 1.4s ease-in-out infinite; }
  .freecard .open { display:inline-block; }
  .freecard .open { animation: nudge 1.6s ease-in-out infinite; }
  .spark { position:absolute; color:var(--rose); font-size:14px; opacity:0; pointer-events:none; animation: twinkle 2.4s ease-in-out infinite; }
  .spark.s1 { right:92px; top:16px; } .spark.s2 { right:10px; top:84px; font-size:11px; color:var(--cer); animation-delay:.8s; }
  .spark.s3 { right:128px; top:58px; font-size:10px; color:#F5B83D; animation-delay:1.6s; }
  @keyframes ring { 0%, 100% { box-shadow:0 0 0 0 color-mix(in srgb, var(--rose) 0%, transparent), 0 18px 40px rgba(60,40,20,.14); }
                    50% { box-shadow:0 0 0 3px color-mix(in srgb, var(--rose) 55%, transparent), 0 18px 44px color-mix(in srgb, var(--rose) 22%, transparent); } }
  @keyframes gift { 0%, 100% { transform:rotate(6deg) translateY(0); } 40% { transform:rotate(6deg) translateY(-6px); }
                    55% { transform:rotate(-4deg) translateY(-6px); } 62% { transform:rotate(12deg) translateY(-4px); } 70% { transform:rotate(6deg) translateY(0); } }
  @keyframes pop { 0%, 100% { transform:scale(1); } 50% { transform:scale(1.12); } }
  @keyframes nudge { 0%, 100% { transform:translateX(0); } 50% { transform:translateX(4px); } }
  @keyframes twinkle { 0%, 100% { opacity:0; transform:scale(.4) rotate(0); } 50% { opacity:1; transform:scale(1.2) rotate(45deg); } }
  /* Product cards: calmer than the freebies card. Swinging bag, shine sweep, slow image zoom, pulsing "Get it";
     featured ones also get the breathing rose ring. --d staggers each card so they don't move in sync. */
  .prod .thumb::after { content:""; position:absolute; inset:0; pointer-events:none;
                        background:linear-gradient(110deg, transparent 40%, rgba(255,255,255,.6) 50%, transparent 60%);
                        transform:translateX(-120%); animation: sweep 4.5s ease-in-out infinite; animation-delay:calc(var(--d) + 1.5s); }
  .prod .emo { animation: swing 3.2s ease-in-out infinite; animation-delay:var(--d); transform-origin:50% 0; }
  .prod .thumb.img img { animation: zoom 9s ease-in-out infinite alternate; }
  .prod .open { display:inline-block; animation: beat 2.2s ease-in-out infinite; animation-delay:var(--d); }
  .prod.featured { animation: ring 2.8s ease-in-out infinite; animation-delay:var(--d); }
  .prod .thumb.img .new { animation: pop 1.4s ease-in-out infinite; }
  @keyframes swing { 0%, 100% { transform:rotate(6deg); } 25% { transform:rotate(-8deg) translateY(-3px); } 50% { transform:rotate(10deg); } 75% { transform:rotate(-2deg); } }
  @keyframes zoom { from { transform:scale(1); } to { transform:scale(1.07); } }
  @keyframes beat { 0%, 100% { transform:scale(1); box-shadow:0 0 0 0 color-mix(in srgb, var(--rose) 45%, transparent); }
                    50% { transform:scale(1.06); box-shadow:0 0 0 6px color-mix(in srgb, var(--rose) 0%, transparent); } }
  /* Link cards: slide in one after another, then stay quiet: a light shine, the letter tile tilting, the arrow nudging.
     Featured links keep their rose ring and get the breathing glow. */
  .link { position:relative; overflow:hidden; opacity:0; animation: rise .55s cubic-bezier(.2,.8,.2,1) forwards; animation-delay:calc(var(--i) * .08s + .2s); }
  .link::after { content:""; position:absolute; inset:0; pointer-events:none;
                 background:linear-gradient(110deg, transparent 40%, color-mix(in srgb, var(--rose) 12%, transparent) 50%, transparent 60%);
                 transform:translateX(-120%); animation: sweep 5s ease-in-out infinite; animation-delay:calc(var(--d) + 2s); }
  .link .ico { animation: tilt 4s ease-in-out infinite; animation-delay:var(--d); }
  .link .open { display:inline-block; animation: nudge 1.8s ease-in-out infinite; animation-delay:var(--d); }
  .link.featured { animation: rise .55s cubic-bezier(.2,.8,.2,1) forwards, ringf 2.8s ease-in-out infinite;
                   animation-delay:calc(var(--i) * .08s + .2s), var(--d); }
  @media (hover:hover) { .link:hover .ico { animation-play-state:paused; transform:rotate(-8deg) scale(1.08); } .link:hover .open { transform:translateX(5px); } }
  @keyframes rise { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:none; } }
  @keyframes tilt { 0%, 100% { transform:rotate(0); } 20% { transform:rotate(-7deg) translateY(-2px); } 40% { transform:rotate(5deg); } 55% { transform:rotate(0); } }
  @keyframes ringf { 0%, 100% { box-shadow:0 0 0 3px var(--rose), 0 18px 40px rgba(60,40,20,.14); }
                     50% { box-shadow:0 0 0 3px var(--rose), 0 0 0 9px color-mix(in srgb, var(--rose) 18%, transparent), 0 18px 44px rgba(60,40,20,.16); } }
  /* Social chips: pop in one by one, then each icon does a small bounce in turn (a wave across the row).
     On hover/tap the chip lifts and takes its platform colour. */
  .socials a { animation: chipin .45s cubic-bezier(.3,1.5,.5,1) backwards; animation-delay:calc(var(--i) * .07s + .1s);
               transition: transform .15s, background .15s, color .15s, border-color .15s; }
  .socials a svg { animation: hop 4.2s ease-in-out infinite; animation-delay:calc(var(--i) * .35s + 1s); }
  .socials a:active { transform: scale(.94); }
  @media (hover:hover) { .socials a:hover { transform: translateY(-3px); color:#fff; border-color:transparent; background:var(--brand, var(--rose)); } }
  .s-instagram { --brand: linear-gradient(110deg,#4f5bd5,#962fbf,#d62976,#fa7e1e); } .s-youtube { --brand:#FF0000; }
  .s-whatsapp { --brand:#25D366; } .s-email { --brand:var(--cer); } .s-x { --brand:#111; } .s-website { --brand:var(--rose); }
  @keyframes chipin { from { opacity:0; transform:translateY(8px) scale(.85); } to { opacity:1; transform:none; } }
  @keyframes hop { 0%, 12%, 100% { transform:none; } 4% { transform:translateY(-4px) rotate(-10deg); } 8% { transform:translateY(0) rotate(6deg); } }
  @media (prefers-reduced-motion: reduce) { .follow, .follow::after, .follow svg, .freecard, .freecard *, .freecard .thumb::after,
    .prod, .prod *, .prod .thumb::after, .link, .link *, .link::after, .socials a, .socials svg, .av, .av::before, .av::after { animation:none !important; }
    .link, .socials a { opacity:1; } .spark { display:none; } }

  .label { font-size:12px; font-weight:800; letter-spacing:2px; color:var(--mute); margin:22px 2px 10px; text-transform:uppercase; }
  .grid { display:grid; gap:14px; }
  .card { display:block; text-decoration:none; background:var(--card); color:var(--card-ink); border-radius:20px; overflow:hidden; transition:transform .15s; }
  .card:active { transform:scale(.98); }
  @media (hover:hover) { .card:hover { transform:translateY(-2px); } }
  .thumb { position:relative; min-height:118px; padding:14px 16px; background:var(--thumb); border-bottom:1.5px solid var(--line); overflow:hidden; }
  .thumb.img { padding:0; min-height:0; }
  .thumb.img img { width:100%; aspect-ratio:16/9; object-fit:cover; display:block; }
  .kw { font-family:Anton,Inter,sans-serif; font-size:46px; line-height:1; letter-spacing:1px; color:var(--card-ink); padding-right:80px; }
  .kw small { display:block; font:800 11px Inter,sans-serif; letter-spacing:2px; color:var(--cer); margin-bottom:6px; }
  .emo { position:absolute; right:14px; top:14px; width:64px; height:64px; border-radius:18px; background:var(--card); display:flex; align-items:center;
         justify-content:center; font-size:34px; box-shadow:0 8px 18px rgba(60,40,20,.12); transform:rotate(6deg); }
  .new { position:absolute; right:12px; bottom:12px; background:var(--rose); color:#fff; font:900 11px Inter,sans-serif; border-radius:20px; padding:3px 9px; }
  .body { padding:12px 16px 14px; }
  .t { font-weight:900; font-size:16px; line-height:1.3; }
  .s { color:var(--card-mute); font-weight:600; font-size:13.5px; margin-top:3px; line-height:1.4; }
  .row { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:10px; }
  .topic { font-size:12px; font-weight:800; color:var(--cer); background:color-mix(in srgb, var(--cer) 10%, transparent); border-radius:20px; padding:4px 10px; }
  .price { font:900 18px Inter; }
  .open { font-weight:900; font-size:14px; color:#fff; background:var(--rose); border-radius:10px; padding:7px 13px; white-space:nowrap; }
  /* Plain links: compact card */
  .link { display:flex; align-items:center; gap:12px; padding:14px 16px; }
  .link .ico { width:46px; height:46px; border-radius:14px; flex:none; display:grid; place-items:center; background:var(--thumb); border:1.5px solid var(--line);
               font:400 22px Anton,Inter,sans-serif; color:var(--card-ink); }
  .link .txt { flex:1; min-width:0; }
  .link.featured { box-shadow:0 0 0 3px var(--rose), 0 18px 40px rgba(60,40,20,.14); }
  .link .open { padding:7px 11px; }
  footer { text-align:center; margin-top:30px; font-size:14px; font-weight:700; color:var(--mute); }
  footer a { color:var(--rose); text-decoration:none; font-weight:900; }
  .toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(80px); opacity:0; pointer-events:none; background:#1C1A17; color:#fff;
           padding:10px 16px; border-radius:12px; font-weight:800; font-size:14px; transition:transform .25s, opacity .25s; z-index:5; }
  .toast.on { transform:translateX(-50%); opacity:1; }

  .join { background:var(--card); color:var(--card-ink); border-radius:20px; padding:18px; display:grid; gap:10px; margin:0 0 14px; }
  .join h2 { margin:0; font:900 20px Inter, sans-serif; letter-spacing:-.02em; }
  .join input { width:100%; padding:12px 14px; border-radius:12px; border:1.5px solid var(--line); font:600 15px Inter, sans-serif; background:transparent; color:inherit; }
  .join button, .join .btn { padding:13px; border:0; border-radius:12px; background:var(--rose); color:#fff; font:900 15px Inter, sans-serif; cursor:pointer; text-align:center; text-decoration:none; }
  .join .msg { font-weight:800; margin:0; }
  .join .err { color:#c2410c; margin:0; font-size:14px; font-weight:700; }
  .join .hp { position:absolute; left:-9999px; }
  .join .note { font-size:12px; color:var(--card-mute); margin:0; font-weight:600; }
  footer .made { font-size:12px; }
  .freecard .kw { text-transform:uppercase; overflow-wrap:anywhere; }
</style>
