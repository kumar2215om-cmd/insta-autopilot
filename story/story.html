<!doctype html><html><head><meta charset="utf-8"><style>
:root{--lime:#d4ff3a;--bg:#0b0c0a;--ink:#f4f6ee;--sub:#a9ae9c}
*{box-sizing:border-box;margin:0}
body{width:1080px;height:1920px;font-family:"Inter Display",Inter,sans-serif;color:var(--ink);overflow:hidden;
 background:radial-gradient(900px 700px at 85% 8%,rgba(212,255,58,.22),transparent 60%),radial-gradient(800px 800px at 0% 100%,rgba(212,255,58,.12),transparent 60%),var(--bg)}
.frame{position:absolute;inset:0;padding:150px 80px 0;display:flex;flex-direction:column}
.chip{align-self:flex-start;font:700 30px "JetBrains Mono";letter-spacing:3px;color:var(--bg);background:var(--lime);padding:14px 26px;border-radius:99px}
.hook{font-size:66px;font-weight:700;line-height:1.12;margin-top:56px;letter-spacing:-1px}
.hook b{color:var(--lime)}
.big{font-size:150px;font-weight:900;line-height:.92;letter-spacing:-5px;margin-top:44px}
.big small{display:block;font-size:68px;letter-spacing:-1.5px;font-weight:800;margin-top:14px}
.big small span{background:var(--lime);color:var(--bg);padding:0 16px;border-radius:14px}
.list{margin-top:50px;display:grid;gap:22px;font-size:42px;font-weight:600}
.list div{display:flex;gap:20px;align-items:center}
.list i{width:52px;height:52px;border-radius:50%;background:var(--lime);color:var(--bg);display:grid;place-items:center;font-style:normal;font-weight:900;font-size:32px;flex:none}
.price{margin-top:60px;display:flex;align-items:center;gap:30px;background:#16180f;border:3px solid var(--lime);border-radius:36px;padding:30px 40px;box-shadow:0 0 80px rgba(212,255,58,.25)}
.price .now{font-size:140px;font-weight:900;color:var(--lime);letter-spacing:-5px;line-height:1}
.price .was{font-size:48px;color:var(--sub);text-decoration:line-through;text-decoration-thickness:5px;text-decoration-color:#ff4d4d}
.price .only{font:700 30px "JetBrains Mono";letter-spacing:2px;color:var(--ink)}
.cta{position:absolute;left:0;right:0;bottom:170px;text-align:center;font-size:44px;font-weight:800}
.cta div{font:600 28px "JetBrains Mono";color:var(--sub);letter-spacing:2px;margin-top:14px}
.slot{position:absolute;left:50%;bottom:290px;transform:translateX(-50%);width:520px;height:110px;border:3px dashed rgba(244,246,238,.35);border-radius:28px}
/* frame 2 */
.pills{display:flex;flex-wrap:wrap;gap:16px;margin-top:50px}
.pills span{font-size:34px;font-weight:600;padding:14px 24px;border-radius:99px;background:#1b1d14;border:2px solid #2d3020}
.pills span.hl{background:var(--lime);color:var(--bg);border-color:var(--lime)}
.steps{margin-top:60px;display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.steps div{background:var(--lime);color:var(--bg);border-radius:28px;padding:28px 24px;font-size:34px;font-weight:800;line-height:1.15}
.steps b{display:block;font-size:56px;font-weight:900}
</style></head><body>
FRAME
</body></html>
