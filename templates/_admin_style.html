<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  /* Shared look for the private admin pages: warm cream "creator studio", rose accent. Light only. */
  :root {
    color-scheme: light;
    --bg:#F1EADC; --panel:#F8F3EA; --card:#fff; --text:#1C1A17; --muted:#8C8780; --line:#E7E0D4; --line2:#E7E0D4;
    --rose:#FF2D95; --rose-ink:#E0197F; --rose-soft:#FFE8F3; --blue:#007BA7; --cer:#007BA7; --green:#15A05A; --amber:#E08A00;
    --violet:#7C4DFF; --err:#DC2626; --ok:#15A05A;
    --grad: #FF2D95; --ring: conic-gradient(#FF2D95, #F5B83D, #007BA7, #FF2D95);
    --sh-sm: 0 2px 6px rgba(60,40,20,.06); --sh: 0 18px 40px rgba(60,40,20,.10);
    --r: 20px; --side: 248px;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.55 Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
         -webkit-font-smoothing: antialiased; }
  a { color: var(--rose-ink); }
  h1, h2, h3 { font-family: Inter, sans-serif; font-weight:900; letter-spacing:-.03em; }
  .kw-font { font-family: Anton, Inter, sans-serif; font-weight:400; letter-spacing:.5px; }

  /* ---------- App shell ---------- */
  .side { position:fixed; inset:0 auto 0 0; width:var(--side); background:var(--panel); border-right:1px solid var(--line);
          display:flex; flex-direction:column; padding:20px 14px; z-index:20; }
  .brand { display:flex; align-items:center; gap:10px; padding:4px 8px 22px; text-decoration:none; color:var(--text); }
  .brand .mark { width:40px; height:40px; border-radius:50%; padding:3px; background:var(--ring); display:grid; place-items:center; }
  .brand .mark span { width:100%; height:100%; border-radius:50%; border:3px solid var(--panel); background:var(--text); color:#fff;
                      display:grid; place-items:center; font:400 17px Anton, Inter, sans-serif; }
  .brand b { font:900 17px Inter; letter-spacing:-.02em; display:block; line-height:1.1; }
  .brand small { display:inline-block; margin-top:3px; font-size:10.5px !important; font-weight:800; color:#fff !important; background:var(--rose);
                 border-radius:20px; padding:1px 8px; }
  .brand small { color:var(--muted); font-size:12px; }
  .nav-label { font-size:11px; font-weight:800; letter-spacing:2px; text-transform:uppercase; color:#A8A096; padding:14px 10px 6px; }
  .nav a { display:flex; align-items:center; gap:11px; padding:9px 10px; margin:2px 0; border-radius:12px; color:#4A443D;
           text-decoration:none; font-weight:800; }
  .nav a .i { width:28px; height:28px; display:grid; place-items:center; border-radius:9px; background:#F1EADF; font-size:15px; }
  .nav a:hover { background:#F2ECE2; }
  .nav a.on { background:var(--rose); color:#fff; box-shadow:0 8px 18px rgba(255,45,149,.25); }
  .nav a.on .i { background:rgba(255,255,255,.22) !important; }
  .nav a.on .i { background:var(--rose-soft); }
  .nav a .ext { margin-left:auto; color:#B5ADA2; font-size:12px; }
  .side-foot { margin-top:auto; padding:12px; border-radius:14px; background:var(--card); border:1px solid var(--line);
               display:flex; align-items:center; gap:10px; font-size:13px; }
  .side-foot .dotlive { width:8px; height:8px; border-radius:50%; background:var(--green); box-shadow:0 0 0 4px rgba(21,160,90,.15); flex:none; }

  .app { margin-left:var(--side); min-height:100vh; min-width:0; }
  .topbar { position:sticky; top:0; z-index:10; background:rgba(241,234,220,.88); backdrop-filter:saturate(1.4) blur(12px);
            border-bottom:1px solid var(--line); }
  .topbar-in { max-width:1320px; margin:auto; padding:14px 28px; display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .topbar h1 { font-size:30px; margin:0; line-height:1.05; letter-spacing:-1px; }
  .topbar h1 span { color:var(--rose); }
  .topbar .sub { font-weight:600; }
  .topbar .sub { color:var(--muted); font-size:13px; }
  .topbar .grow { margin-right:auto; }
  .wrap { max-width:1320px; margin:auto; padding:24px 28px 60px; }

  @media (max-width: 900px) {
    .side { position:sticky; inset:auto; top:0; width:auto; height:auto; flex-direction:row; align-items:center; gap:6px;
            padding:10px 12px; border-right:0; border-bottom:1px solid var(--line); overflow-x:auto; }
    .brand { padding:0 6px 0 0; } .brand small, .brand b, .nav-label, .side-foot { display:none; }
    .nav { display:flex; gap:4px; } .nav a { white-space:nowrap; padding:7px 10px; margin:0; } .nav a .ext { display:none; }
    .app { margin-left:0; }
    .topbar { position:static; } .topbar-in, .wrap { padding-left:16px; padding-right:16px; }
  }

  /* ---------- Building blocks ---------- */
  .card { background:var(--card); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--sh); }
  .card-h { display:flex; align-items:center; gap:10px; padding:18px 20px 0; flex-wrap:wrap; }
  .card-h h2 { font-size:19px; margin:0; display:flex; align-items:center; gap:8px; }
  .card-b { padding:16px 20px 20px; }
  .muted { color:var(--muted); font-size:12.5px; font-weight:400; }
  .hint { font-size:12.5px; color:var(--muted); }
  .ok { color:var(--ok); } .error { color:var(--err); }

  .btn, button { display:inline-flex; align-items:center; justify-content:center; gap:7px; padding:9px 15px; border-radius:12px;
         border:2px solid transparent; background:var(--text); color:#fff; font:800 13.5px Inter, sans-serif; cursor:pointer;
         text-decoration:none; transition: transform .12s, box-shadow .12s, background .12s; white-space:nowrap; }
  button:hover, .btn:hover { transform: translateY(-1px); box-shadow:0 6px 16px rgba(28,26,23,.14); }
  button:active { transform:none; }
  button:disabled { opacity:.5; cursor:not-allowed; transform:none; box-shadow:none; }
  .btn-primary, button.primary { background:var(--rose); font-weight:800; }
  .btn-primary:hover, button.primary:hover { box-shadow:0 8px 20px rgba(255,45,149,.3); }
  .btn-ghost, button.secondary, button.ghost { background:var(--card); color:var(--text); border-color:var(--line); box-shadow:none; }
  button.secondary:hover, .btn-ghost:hover { background:#FFFDF9; box-shadow:var(--sh-sm); }
  button.danger { background:var(--card); color:var(--err); border-color:#F5D0D0; }
  button.danger:hover { background:#FFF5F5; box-shadow:none; }
  button.sm, .btn.sm { padding:6px 10px; font-size:12.5px; border-radius:9px; }

  label { font-size:12.5px; font-weight:800; color:#5C564E; }
  input[type=text], input:not([type]), textarea, select { width:100%; padding:10px 12px; border:2px solid var(--line); border-radius:12px;
          background:#fff; color:var(--text); font:14px/1.45 Inter, sans-serif; transition: border-color .12s, box-shadow .12s; }
  input[type=text]:focus, textarea:focus, select:focus { outline:0; border-color:var(--rose); box-shadow:0 0 0 4px rgba(255,45,149,.12); background:#fff; }
  textarea { resize:vertical; }
  input[type=checkbox] { accent-color: var(--rose); width:16px; height:16px; }

  .badge { display:inline-flex; align-items:center; gap:5px; font-size:11.5px; padding:3px 9px; border-radius:99px; font-weight:700; }
  .badge::before { content:""; width:6px; height:6px; border-radius:50%; background:currentColor; }
  .badge.on { background:#E3F6EC; color:var(--green); }
  .badge.off { background:#F1ECE4; color:var(--muted); }

  .banner { display:none; margin:0 0 16px; padding:12px 16px; border-radius:14px; font-weight:500; border:1px solid; }
  .banner.err { background:#FFF1F1; border-color:#F7CFCF; color:#9B1C1C; }
  .banner.warn { background:#FFF7E8; border-color:#F6DDAE; color:#8A5300; }
</style>
