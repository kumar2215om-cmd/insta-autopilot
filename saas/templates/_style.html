<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root { --bg:#F7F7F4; --ink:#15151A; --rose:#5B3DF5; --blue:#4A2FE0; --mute:#5C5C66; --line:#E4E4DE;
          --card:#fff; --ok:#15803d; --bad:#c2410c; --shadow:0 18px 40px rgba(60,40,20,.12); }
  * { box-sizing:border-box; }
  html, body { margin:0; }
  body { background:var(--bg); color:var(--ink); font:15px/1.55 Geist, Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
  a { color:var(--blue); }
  h1, h2, h3 { font-weight:900; letter-spacing:-.02em; line-height:1.1; margin:0; }
  .wrap { max-width:1080px; margin:0 auto; padding:0 16px; }
  .label { font-size:12px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:var(--blue); }
  .hl { color:var(--rose); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:20px; box-shadow:var(--shadow); padding:20px; }
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; border:0; border-radius:999px;
         padding:12px 20px; font:700 15px Geist, Inter, sans-serif; cursor:pointer; text-decoration:none;
         background:var(--rose); color:#fff; transition:transform .15s, box-shadow .15s; }
  .btn:hover { transform:translateY(-1px); box-shadow:0 8px 20px rgba(91,61,245,.28); }
  .btn.dark { background:var(--ink); }
  .btn.ghost { background:transparent; color:var(--ink); border:2px solid var(--ink); }
  .btn.small { padding:8px 14px; font-size:13px; }
  .btn:disabled { opacity:.5; cursor:default; transform:none; box-shadow:none; }
  input[type=text], textarea { width:100%; border:1.5px solid var(--line); border-radius:12px; padding:10px 12px;
         font:15px Inter, sans-serif; background:#fffdf9; color:var(--ink); }
  input[type=text]:focus, textarea:focus { outline:none; border-color:var(--rose); }
  .muted { color:var(--mute); }
  .err { color:var(--bad); }
  nav.tabs { display:flex; flex-wrap:wrap; gap:6px; padding:4px; background:#ECECE6; border-radius:14px; width:max-content; max-width:100%; margin:4px 0 12px; }
  nav.tabs a { padding:9px 16px; border-radius:11px; font-weight:800; font-size:14px; color:var(--ink); text-decoration:none; }
  nav.tabs a[aria-current="page"] { background:#fff; box-shadow:0 2px 8px rgba(60,40,20,.1); }
  .autobanner { display:flex; flex-wrap:wrap; gap:12px; align-items:center; background:var(--ink); color:#fff; border-radius:16px; padding:14px 18px; margin:8px 0; }
  .autobanner p { margin:0; flex:1 1 320px; }
  .autobanner .btn.ghost { color:#fff; border-color:#6b6660; }
  @media (prefers-reduced-motion: reduce) { * { animation:none !important; transition:none !important; } }
</style>
